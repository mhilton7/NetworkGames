{{define "change-password.html"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password · WiiBridge</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="auth-page"><main class="auth-card"><div class="brand-mark">WB</div>
<p class="eyebrow">Account security</p><h1>Choose a private password</h1>
<div class="notice warning">The bootstrap password must be replaced before administrative actions are enabled.</div>
{{if .Error}}<div class="notice error" role="alert">{{.Error}}</div>{{end}}
<form method="post" action="/account/password" class="form-stack">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>Current password<input type="password" name="current" autocomplete="current-password" required></label>
<label>New password<input type="password" name="password" autocomplete="new-password" minlength="12" required><small>Use at least 12 characters.</small></label>
<label>Confirm new password<input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
<button type="submit">Change password</button></form></main></body></html>{{end}}
