{{define "change-password.html"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password · WiiBridge</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="auth-page"><main class="auth-card"><div class="brand-mark">WB</div>
<p class="eyebrow">Account security</p><h1>Protect your WiiBridge account</h1>
<div class="notice warning">Replace the starter password before using administrative controls.</div>
{{if .Error}}<div class="notice error" role="alert">{{.Error}}</div>{{end}}
<form method="post" action="/account/password" class="form-stack" autocomplete="on">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="current-password">Current password<input id="current-password" type="password" name="current" autocomplete="current-password" required></label>
<label for="new-password">New password<input id="new-password" type="password" name="password" autocomplete="new-password" minlength="12" required><small>Use at least 12 characters.</small></label>
<label for="confirm-password">Confirm new password<input id="confirm-password" type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
<button type="submit">Change password</button></form></main></body></html>{{end}}
