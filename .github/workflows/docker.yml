name: Docker Image CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p build/container-root
          go build -trimpath -ldflags="-s -w -buildid=" \
            -o build/container-root/networkgames-host \
            ./server/host-daemon

      - name: Build Docker image
        run: |
          docker build . \
            --file server/packaging/container/Dockerfile \
            --tag "networkgames-host:${GITHUB_SHA}"
